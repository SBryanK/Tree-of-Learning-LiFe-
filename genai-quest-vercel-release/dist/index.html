function updateRetrieval(){
 const tenant=$('#tenant').value,scope=$('#scope-filter').checked,active=$('#active-filter').checked,k=+$('#retrieval-k').value,eligible=DOCS.filter(d=>(!scope||d.tenant===tenant)&&(!active||d.active)),selected=eligible.slice(0,k),leak=selected.some(d=>d.tenant!==tenant),stale=selected.some(d=>!d.active);
 $('#retrieval-output').innerHTML=`<h2>Query: aturan reimbursement terbaru?</h2><p>Similarity scores sintetis tetap, bukan dihitung dari text. Filter mengubah eligibility; tidak “memperbaiki” score.</p>${DOCS.map(d=>`<div class="rank-row ${eligible.includes(d)?'':'excluded'}"><strong>${d.id} · similarity ${d.score}</strong><br>${esc(d.text)}<br>${!eligible.includes(d)?'Excluded by filter':selected.includes(d)?'Retrieved in top-k':'Eligible, di luar top-k'}</div>`).join('')}<div class="notice ${leak||stale?'warning':'good'}">${leak?'Risiko kebocoran: dokumen tenant lain masuk hasil. ':''}${stale?'Stale context: versi lama masuk hasil. ':''}${!leak&&!stale?'Hasil terpilih berada dalam scope tenant dan versi aktif pada contoh ini. Tetap perlu validasi relevansi dan enforcement nyata.':''}</div>`;
}
function updateEvaluation(){
 const cases=[{q:'Batas reimbursement 2026?',c:'Kebijakan 2024: batas 1 juta.',a:'Batas 1 juta sesuai kebijakan 2024.',f:'Faithful terhadap context, tetapi freshness dan jawaban untuk query 2026 bermasalah. Mulai perbaikan dari versi dokumen/retrieval.'},{q:'Batas reimbursement 2026?',c:'Kebijakan 2026: batas 2 juta.',a:'Batas 2 juta dan semua klaim otomatis disetujui.',f:'Context relevan, tetapi klaim persetujuan otomatis tidak didukung. Periksa generation, grounding dan business checks.'},{q:'Batas reimbursement 2026?',c:'Kebijakan 2026: batas 2 juta.',a:'Portal HR memiliki tampilan baru.',f:'Bukti yang tepat tersedia, tetapi response tidak menjawab query. Answer relevance bermasalah; periksa prompt/generation.'}],x=cases[+$('#eval-case').value];
 $('#evaluation-output').innerHTML=`<h3>Query</h3><p>${x.q}</p><h3>Retrieved context</h3><p>${x.c}</p><h3>Generated answer</h3><p>${x.a}</p><details class="detail"><summary>Reveal diagnosis</summary><p>${x.f}</p></details><p class="small-text muted">Tidak ada “skor kualitas” buatan. Diagnosis berdasarkan hubungan query, context dan klaim yang dapat diperiksa.</p>`;
}
function validateJSON(){
 let x;try{x=JSON.parse($('#json-input').value);}catch(e){$('#json-output').innerHTML='<h2>Syntax failed</h2><div class="notice error">JSON tidak dapat di-parse. Periksa quotes, commas dan brackets. Tidak ada tindakan dieksekusi.</div>';return;}
 const errors=[];if(!x||typeof x!=='object'||Array.isArray(x))errors.push('Harus object.');else{if(!['delivery','billing','other'].includes(x.category))errors.push('category harus salah satu enum delivery/billing/other.');if(typeof x.summary!=='string')errors.push('summary wajib string.');if(Object.keys(x).some(k=>!['category','summary'].includes(k)))errors.push('Extra fields tidak diizinkan.');}
 $('#json-output').innerHTML=errors.length?`<h2>Schema failed</h2><ul>${errors.map(e=>`<li>${e}</li>`).join('')}</ul><p>Validator ini adalah subset demonstrasi, bukan implementasi lengkap JSON Schema.</p>`:`<h2>Schema passed</h2><div class="notice ${x.category==='delivery'?'good':'warning'}">${x.category==='delivery'?'Category sesuai evidence kasus tetap.':'Semantic conflict: input menyebut paket belum diterima, sehingga category ini tidak sesuai.'}</div><p>Summary: ${esc(x.summary)}</p><p><strong>Semantic review masih diperlukan.</strong> Parser tidak dapat membuktikan semua klaim summary. Cek apakah menambah fakta, membocorkan data, atau menyetujui tindakan tanpa policy.</p>`;
}
function updatePolicy(){const full=$('#fulltime').checked,years=+$('#years').value,eligible=full&&years>=1;$('#years-value').textContent=years.toFixed(1);$('#policy-output').innerHTML=`<h2>${eligible?'Eligible':'Not eligible'} · aturan sintetis</h2><div class="formula">fullTime = ${full}<br>yearsOfService ≥ 1 = ${years>=1}<br>${full} AND ${years>=1} = ${eligible}</div><p>Semua syarat AND harus benar. Contoh ini hanya menunjukkan formal logic, bukan kebijakan cuti perusahaan atau simulasi layanan Automated Reasoning AWS.</p><p>Policy document harus diterjemahkan dan ditinjau dengan benar. Pengecualian yang hilang tidak akan ditemukan oleh aturan sempit ini.</p>`;}
function go(path){if(location.hash==='#'+path)route();else location.hash=path;}
function refresh(){const y=window.scrollY;route();window.scrollTo({top:y,left:0,behavior:'instant'});}
function exportProgress(){
 const payload={...state,exportedAt:new Date().toISOString()},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='genai-quest-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('Export dibuat. Simpan file JSON sebagai backup.');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.guideStep){guideStep=b.dataset.guideStep;$('#lesson-guide').innerHTML=guideMarkup(b.dataset.guideLesson);$('[data-guide-step=\"'+guideStep+'\"]').focus();return;}
 if(b.dataset.milestonePractice){const m=MODULES.find(m=>m.id===b.dataset.milestonePractice);if(m)startRun(QUESTIONS.filter(q=>m.lessons.includes(q.lesson)));return;}
 if(b.dataset.anchor){e.preventDefault();const target=document.getElementById(b.dataset.anchor);target?.scrollIntoView();if(b.dataset.anchor==='main')target?.focus();return;}
 if(b.dataset.go){go(b.dataset.go);return;}
 if(b.dataset.practice){startRun(QUESTIONS.filter(q=>q.lesson===b.dataset.practice));return;}
 if(b.dataset.read){const id=b.dataset.read;state.read[id]=!state.read[id];save();b.textContent=state.read[id]?'Ditandai dibaca · self-assessment':'Tandai sudah dibaca';b.setAttribute('aria-pressed',!!state.read[id]);const evidence=$('.reading-aside .badge');if(evidence)evidence.outerHTML=badge(id);notify('Status baca diperbarui; bukan bukti mastery.');return;}
 if(b.dataset.bookmark){state.bookmarks[b.dataset.bookmark]=!state.bookmarks[b.dataset.bookmark];save();refresh();return;}
 if(b.dataset.confused){const id=b.dataset.confused;state.confused[id]=!state.confused[id];if(state.confused[id])state.review[id]={due:Date.now(),streak:0};save();refresh();return;}
 if(b.dataset.reveal){const target=document.getElementById(b.dataset.reveal);target.hidden=!target.hidden;b.setAttribute('aria-expanded',!target.hidden);b.textContent=target.hidden?'Reveal model answer':'Sembunyikan jawaban';return;}
 if(b.dataset.sourcePage){const page=+b.dataset.sourcePage;if(pdfUrl)window.open(pdfUrl+'#page='+page,'_blank','noopener');else{$('#pdf-file').click();notify('Pilih PDF sumber lokal, lalu klik lagi nomor halaman. File tidak diunggah.');}return;}
 if(b.dataset.option!==undefined&&run&&!run.submitted){run.selected=+b.dataset.option;renderQuiz();$('[data-option="'+run.selected+'"]').focus();return;}
 if(b.dataset.mapBranch){mapBranch=b.dataset.mapBranch;renderMap();return;}
 if(b.dataset.mapNode){e.preventDefault();selectedMap=b.dataset.mapNode;renderMap();return;}
 if(b.dataset.glossaryMode){glossaryMode=b.dataset.glossaryMode;guessReveal=false;renderGlossary();return;}
 if(b.dataset.lab){activeLab=b.dataset.lab;renderLabs();return;}
 if(b.dataset.arch!==undefined){const i=+b.dataset.arch,feedback=[
  'Prompt-only tidak memiliki sumber kebijakan baru yang dapat dikutip. Ia cocok sebagai baseline instruksi, tetapi tidak cukup untuk constraints freshness ini.',
  'Pilihan tepat: retrieval sumber versi berlaku, scope akses dan citation sesuai kebutuhan. Tetap uji retrieval/grounding; RAG bukan jaminan tanpa hallucination.',
  'Fine-tuning dapat membantu behavior dengan dataset berlabel, tetapi constraints ini membutuhkan update fakta/citation dan belum memiliki target pairs. Training mingguan bukan langkah pertama yang tepat.',
  'Continued pre-training dapat membantu bahasa domain, tetapi tidak memberi update/citation deterministik. Pilih berdasarkan failure yang terbukti, bukan sekadar jumlah dokumen.'
 ];$$("[data-arch]").forEach((b,j)=>{b.setAttribute('aria-pressed',i===j);b.classList.toggle('selected',i===j);});$('#arch-feedback').innerHTML=`<div class="notice ${i===1?'good':'warning'}">${feedback[i]}</div>`;if(i===1){const earned=!state.labs.architecture;state.labs.architecture=true;save();if(earned)notify('Architecture challenge tercapai · +15 XP');}return;}
 if(b.dataset.checkLab){const id=b.dataset.checkLab,value=$('#lab-answer').value,answers={cosine:1,chunk:0,retrieval:1,evaluation:1,json:1,policy:1},feedback={cosine:'Dot product dua arah orthogonal adalah nol; kedua norm tetap nonzero.',chunk:'Overlap mengulang isi batas. Duplikasi token bertambah; makna tidak otomatis dipahami.',retrieval:'Scope akses berasal dari authenticated identity dan policy backend, bukan instruksi bebas.',evaluation:'Faithful pada context lama belum menjawab fakta yang berlaku pada waktu query.',json:'Schema hanya memeriksa bentuk data; keputusan memerlukan evidence, policy dan izin.',policy:'Tepat 1 memenuhi ≥1; fullTime=true, sehingga true AND true = true.'};
  if(value===''){$('#lab-feedback').textContent='Pilih jawaban sebelum memeriksa.';return;}
  const correct=+value===answers[id];$('#lab-feedback').textContent=(correct?'Tepat. ':'Belum tepat. ')+feedback[id];
  if(correct){const earned=!state.labs[id];state.labs[id]=true;save();if(earned)notify('Mission check tercapai · +15 XP');}return;
 }
 switch(b.dataset.action){
 case 'next-milestone':{const m=MODULES.find(m=>!milestoneProgress(m).done);go(m?'milestones/'+m.id:'revision');break;}
  case 'focus':document.body.classList.toggle('focus-mode');$('#focus-exit').focus();break;
  case 'skip-diagnostic':state.diagnostic={done:false,skipped:true,score:0,weak:[]};run=null;save();go('dashboard');break;
  case 'start-practice':{const scope=$('#practice-scope').value;let qs;if(scope==='all')qs=LESSONS.map(l=>QUESTIONS.filter(q=>q.lesson===l.id)[Math.floor(Math.random()*3)]);else if(scope.startsWith('module:'))qs=QUESTIONS.filter(q=>moduleFor(q.lesson).id===scope.slice(7));else qs=QUESTIONS.filter(q=>q.lesson===scope);startRun(qs);break;}
  case 'start-review':{const ids=dueLessons().map(l=>l.id);startRun(QUESTIONS.filter(q=>ids.includes(q.lesson)));break;}
  case 'submit-answer':if(run&&!run.submitted&&run.selected!==null){const q=questionById(run.ids[run.index]);run.submitted=true;const result={q:q.id,choice:run.selected,correct:run.selected===q.answer};run.results.push(result);if(run.mode!=='diagnostic'){const firstCorrect=result.correct&&!state.attempts.some(a=>a.q===q.id&&a.correct);record(q,run.selected);if(firstCorrect)notify('+10 XP · keputusan benar pertama untuk soal ini.');}renderQuiz();$('[data-action="next-question"]').focus();}break;
  case 'next-question':if(run&&run.submitted){run.index++;run.selected=null;run.submitted=false;renderQuiz();window.scrollTo({top:0,left:0,behavior:'instant'});}break;
  case 'retry-question':if(run){run.selected=null;run.submitted=false;renderQuiz();}break;
  case 'restart-run':if(run)startRun(run.ids.map(questionById),run.mode);break;
  case 'exit-practice':run=null;go('practice');break;
  case 'toggle-map':mapList=!mapList;renderMap();break;
  case 'reveal-guess':guessReveal=true;filterGlossary();break;
  case 'next-guess':guessIndex++;guessReveal=false;filterGlossary();break;
  case 'connect-pdf':$('#pdf-file').click();break;
  case 'export':exportProgress();break;
  case 'import':$('#import-file').click();break;
  case 'validate-json':validateJSON();break;
  case 'bad-json':$('#json-input').value='{"category":"billing","summary":42,"refundApproved":true}';validateJSON();break;
 }
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.notes){state.notes[el.dataset.notes]=el.value.slice(0,50000);save();$('#notes-status').textContent=storage?'Catatan tersimpan di browser ini.':'Session only · export untuk menyimpan.';}
 if(el.dataset.recall){state.recall[el.dataset.recall]=el.value.slice(0,10000);save();}
 if(el.id==='lesson-search'){lessonSearch=el.value;filterLessons();}
 if(el.id==='glossary-search'){glossarySearch=el.value;guessIndex=0;guessReveal=false;filterGlossary();}
 if(el.id==='page-search')$('#page-index').innerHTML=renderPageIndex(el.value);
 if(el.hasAttribute('data-lab-input')){if(activeLab==='cosine')updateCosine();else if(activeLab==='chunk')updateChunk();else if(activeLab==='retrieval')updateRetrieval();else if(activeLab==='evaluation')updateEvaluation();else if(activeLab==='policy')updatePolicy();}
});
document.addEventListener('change',e=>{if(e.target.id==='lesson-filter'){lessonFilter=e.target.value;filterLessons();}});
document.addEventListener('submit',e=>{if(e.target.id==='study-form'){e.preventDefault();const data=new FormData(e.target);state.preferences={minutes:+data.get('minutes'),level:data.get('level'),deadline:data.get('deadline')};save();renderSettings();notify('Kapasitas dan estimasi rencana diperbarui.');}});
$('#focus-exit').addEventListener('click',()=>{document.body.classList.remove('focus-mode');$('.focus-toggle')?.focus();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('focus-mode'))$('#focus-exit').click();});
$('#import-file').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 try{if(file.size>5000000)throw Error('File terlalu besar; maksimum 5 MB.');const candidate=validState(JSON.parse(await file.text()));if(window.confirm('File valid. Import akan mengganti progres yang sedang dibuka. Lanjutkan?')){state=candidate;run=null;save();route();notify('Progress berhasil di-import.');}}
 catch(err){notify('Import ditolak: '+err.message+' Progres saat ini tetap aman.');}finally{e.target.value='';}
});
$('#pdf-file').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;const header=await file.slice(0,5).text();if(header!=='%PDF-'){notify('File bukan PDF yang dapat dikenali. Pilih file sumber yang benar.');e.target.value='';return;}
 if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(file);notify('PDF lokal terhubung pada sesi ini. Klik nomor halaman di lesson.');e.target.value='';
});
window.addEventListener('hashchange',route);
route();
if(!storage)notify('Penyimpanan browser tidak tersedia/bermasalah. Gunakan Export untuk menyimpan progres.');
</script>
